# ===================================================================
# E2E BASE CONFIGURATION (COMMON TO ALL TEST ENVIRONMENTS)
# ===================================================================
e2e.env=prd
e2e.http.timeout.connect-ms=5000
e2e.http.timeout.read-ms=10000
e2e.logging.enabled=true

# Logging (Plain-text Console, No JSON)
logging.structured.format.console=

# New Relic Observability Validation
newrelic.account-id=${NEW_RELIC_ACCOUNT_ID:8469279}
newrelic.api-key=${NEW_RELIC_API_KEY:}
newrelic.validation.enabled=${E2E_NEWRELIC_VALIDATION_ENABLED:true}
newrelic.validation.timeout-seconds=${E2E_NEWRELIC_TIMEOUT_SECONDS:15}
newrelic.validation.metric-timeout-seconds=${E2E_NEWRELIC_METRIC_TIMEOUT_SECONDS:120}
